# Generated by twinwrap. Regenerate with `twinwrap workflow`; edits are overwritten.
#
# Push or pull request: build and run `twinwrap test` (Python and Node agree).
# Tag flow-stats-v*: also build a wheel per platform, check each against the reference
# results, upload to PyPI, stage on npmjs.com for approval.
#
# One-time setup (see `twinwrap doctor`):
#   PyPI   trusted publisher: this repo, workflow twinwrap-flow-stats.yml, environment pypi
#   npm    trusted publisher: this repo, workflow twinwrap-flow-stats.yml, environment npm,
#          staged publishing only
name: twinwrap flow-stats

on:
  push:
    branches: [main, master]
    tags: ["flow-stats-v*"]
    paths:
      - "flow-stats/**"
      - ".github/workflows/twinwrap-flow-stats.yml"
  pull_request:
    paths:
      - "flow-stats/**"
      - ".github/workflows/twinwrap-flow-stats.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TWINWRAP: "twinwrap @ git+https://github.com/godofecht/twinwrap@37a67f4d1c9bec824cce5b88e23a4b47d10c2707"
  FLOW_REF: "v2.0.0"

jobs:
  reference:
    name: build, test, reference results (linux-x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Get the Flow compiler (v2.0.0)
        shell: bash
        run: |
          git clone --depth 1 --branch "$FLOW_REF" https://github.com/flooooooooooow/flow.git "$RUNNER_TEMP/flow"
          echo "TWINWRAP_FLOW=$RUNNER_TEMP/flow" >> "$GITHUB_ENV"
      - name: Get wasi-sdk 25
        shell: bash
        run: |
          v=25
          case "$(uname -m)" in x86_64) arch=x86_64 ;; aarch64|arm64) arch=arm64 ;; esac
          url="https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-$v/wasi-sdk-$v.0-$arch-linux.tar.gz"
          curl -sSfL "$url" | tar -xz -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-$v.0-$arch-linux" >> "$GITHUB_ENV"
      - name: Install twinwrap
        run: python -m pip install "$TWINWRAP"
      - name: Build both packages
        run: python -m twinwrap -C flow-stats build --out dist
      - name: Python and Node agree
        run: python -m twinwrap -C flow-stats test --no-build --emit reference.json
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/flow-stats-v')
        run: python -m twinwrap -C flow-stats check-tag "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: reference
          path: reference.json
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: flow-stats/dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: npm
          path: flow-stats/.twinwrap/npm

  wheels:
    name: wheel ${{ matrix.label }}
    needs: reference
    if: startsWith(github.ref, 'refs/tags/flow-stats-v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04-arm, label: linux-aarch64 }
          - { os: macos-15, label: macos-arm64 }
          - { os: macos-15-intel, label: macos-x86_64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get the Flow compiler (v2.0.0)
        shell: bash
        run: |
          git clone --depth 1 --branch "$FLOW_REF" https://github.com/flooooooooooow/flow.git "$RUNNER_TEMP/flow"
          echo "TWINWRAP_FLOW=$RUNNER_TEMP/flow" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: reference
      - name: Install twinwrap
        run: python -m pip install "$TWINWRAP"
      - name: Build the wheel
        run: python -m twinwrap -C flow-stats build --python-only --out dist
      - name: Installed wheel matches the reference bit for bit
        shell: bash
        run: python -m twinwrap -C flow-stats test --wheel flow-stats/dist/*.whl --against reference.json
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.label }}
          path: flow-stats/dist/*.whl

  pypi:
    name: upload to PyPI
    needs: [reference, wheels]
    if: startsWith(github.ref, 'refs/tags/flow-stats-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - run: ls -la dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  npm:
    name: stage on npmjs.com
    needs: [reference, wheels]
    if: startsWith(github.ref, 'refs/tags/flow-stats-v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install an npm with staged publishing
        run: npm install -g npm@11.21.3 && npm -v
      - name: Install twinwrap
        run: python -m pip install "$TWINWRAP"
      - uses: actions/download-artifact@v4
        with:
          name: npm
          path: .twinwrap-npm
      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#flow-stats-v}" >> "$GITHUB_ENV"
      # Staged: the version waits on npmjs.com until you approve it there
      # with your security key, or with `npm stage approve <id>`.
      - name: Stage on npmjs.com
        working-directory: .twinwrap-npm
        run: |
          if npm view "flow-stats@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::npmjs.com already has $VERSION"
          else
            npm stage publish . --access public --ignore-scripts
            echo "::notice::flow-stats@$VERSION is staged. Approve it at https://www.npmjs.com/package/flow-stats"
          fi
