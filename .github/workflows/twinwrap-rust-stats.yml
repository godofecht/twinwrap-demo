# Generated by twinwrap. Regenerate with `twinwrap workflow`; edits are overwritten.
#
# Push or pull request: build and run `twinwrap test` (Python and Node agree).
# Tag rust-stats-v*: also build a wheel per platform, check each against the reference
# results, upload to PyPI, stage on npmjs.com for approval.
#
# One-time setup (see `twinwrap doctor`):
#   PyPI   trusted publisher: this repo, workflow twinwrap-rust-stats.yml, environment pypi
#   npm    trusted publisher: this repo, workflow twinwrap-rust-stats.yml, environment npm,
#          staged publishing only
name: twinwrap rust-stats

on:
  push:
    branches: [main, master]
    tags: ["rust-stats-v*"]
    paths:
      - "rust-stats/**"
      - ".github/workflows/twinwrap-rust-stats.yml"
  pull_request:
    paths:
      - "rust-stats/**"
      - ".github/workflows/twinwrap-rust-stats.yml"
  workflow_dispatch:

permissions:
  contents: read

# bash on every runner, Windows included, so $VARS and globs mean one thing.
defaults:
  run:
    shell: bash

env:
  TWINWRAP: "twinwrap @ git+https://github.com/godofecht/twinwrap@a12dbce49dc9fa60dc03723ec29010ce9285c246"
  FLOW_REF: "v2.0.0"

jobs:
  reference:
    name: build, test, reference results (linux-x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust-stats/.twinwrap/glue -> ../target"
      - name: Install twinwrap
        run: python -m pip install "$TWINWRAP"
      - name: Build both packages
        run: python -m twinwrap -C rust-stats build --out dist
      - name: Python and Node agree
        run: python -m twinwrap -C rust-stats test --no-build --emit reference.json
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/rust-stats-v')
        run: python -m twinwrap -C rust-stats check-tag "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: reference
          path: reference.json
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: rust-stats/dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: npm
          path: rust-stats/.twinwrap/npm

  wheels:
    name: wheel ${{ matrix.label }}
    needs: reference
    if: startsWith(github.ref, 'refs/tags/rust-stats-v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04-arm, label: linux-aarch64 }
          - { os: macos-15, label: macos-arm64 }
          - { os: macos-15-intel, label: macos-x86_64 }
          - { os: windows-2022, label: windows-x86_64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust-stats/.twinwrap/glue -> ../target"
      - uses: actions/download-artifact@v4
        with:
          name: reference
      - name: Install twinwrap
        run: python -m pip install "$TWINWRAP"
      - name: Build the wheel
        run: python -m twinwrap -C rust-stats build --python-only --out dist
      - name: Installed wheel matches the reference bit for bit
        shell: bash
        run: python -m twinwrap -C rust-stats test --wheel rust-stats/dist/*.whl --against reference.json
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.label }}
          path: rust-stats/dist/*.whl

  pypi:
    name: upload to PyPI
    needs: [reference, wheels]
    if: startsWith(github.ref, 'refs/tags/rust-stats-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - run: ls -la dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  npm:
    name: stage on npmjs.com
    needs: [reference, wheels]
    if: startsWith(github.ref, 'refs/tags/rust-stats-v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install an npm with staged publishing
        run: npm install -g npm@11.21.3 && npm -v
      - name: Install twinwrap
        run: python -m pip install "$TWINWRAP"
      - uses: actions/download-artifact@v4
        with:
          name: npm
          path: .twinwrap-npm
      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#rust-stats-v}" >> "$GITHUB_ENV"
      # Staged: the version waits on npmjs.com until you approve it there
      # with your security key, or with `npm stage approve <id>`.
      - name: Stage on npmjs.com
        working-directory: .twinwrap-npm
        run: |
          if npm view "rust-stats@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::npmjs.com already has $VERSION"
          else
            npm stage publish . --access public --ignore-scripts
            echo "::notice::rust-stats@$VERSION is staged. Approve it at https://www.npmjs.com/package/rust-stats"
          fi
