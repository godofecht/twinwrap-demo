[package]
name = "flow-stats"
version = "0.1.0"
description = "Example: a Flow library wrapped for PyPI and npm by twinwrap."
license = "MIT"
repository = "https://github.com/godofecht/twinwrap-demo"

[source]
lang = "flow"
path = "src/stats.flow"

[[function]]
sig = "fn add(a: i32, b: i32) -> i32"

[[function]]
sig = "fn mean(xs: [f64]) -> f64"

[[function]]
sig = "fn scale(xs: [f64], k: f64) -> [f64; len(xs)]"

[[function]]
sig = "fn clamp(xs: [f64], lo: f64, hi: f64) -> [f64; len(xs)]"

[[function]]
sig = "fn count_vowels(s: str) -> i32"

[[function]]
sig = "fn fib(n: i32) -> i64"

[[function]]
sig = "fn axpy(a: f64, x: f64, y: f64) -> f64"

[[test]]
call = "add"
args = [2, 40]
expect = 42

[[test]]
call = "mean"
args = [[0.1, 0.2, 0.3]]

[[test]]
call = "scale"
args = [[1.0, -2.5, 0.0], -0.0]

[[test]]
call = "clamp"
args = [[-3.0, 0.5, 9.0], 0.0, 1.0]
expect = [0.0, 0.5, 1.0]

[[test]]
call = "count_vowels"
args = ["twinwrap builds both"]
expect = 5

[[test]]
call = "fib"
args = [90]
expect = 2880067194370816120


[[test]]
call = "axpy"
args = [0.1, 10.0, -1.0]
expect = 0.0
